services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-events-postgres
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campus_events
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_events"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

