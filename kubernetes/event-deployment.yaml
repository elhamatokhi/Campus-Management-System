apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: campusmngmntacr-hedvhmc7e6ccdret.azurecr.io/campus-event-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: campus-config
                  key: NODE_ENV
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: campus-config
                  key: FRONTEND_ORIGIN
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: campus-config
                  key: JWT_EXPIRES_IN
            - name: AZURE_STORAGE_CONTAINER_NAME
              valueFrom:
                configMapKeyRef:
                  name: campus-config
                  key: AZURE_STORAGE_CONTAINER_NAME
            - name: MAX_IMAGE_UPLOAD_BYTES
              valueFrom:
                configMapKeyRef:
                  name: campus-config
                  key: MAX_IMAGE_UPLOAD_BYTES
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: JWT_SECRET
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: AZURE_STORAGE_CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
